<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中秋快乐 · 致我的兄弟们</title>
<style>
:root{
  --cream:#fff3e2;
  --cream-dim:#e9c9a4;
  --gold:#ffc46b;
  --gold-2:#ffe0a8;
  --serif:"KaiTi","STKaiti","Kaiti SC","楷体","Noto Serif SC",serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  color:var(--cream);
  background:#1a0703;
  overflow:hidden;
  height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(255,170,70,.35)}

/* ============ 背景 ============ */
.bg{position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(1100px 720px at 50% -4%, #93400f 0%, transparent 60%),
    radial-gradient(820px 620px at 90% 10%, #6d2b0a 0%, transparent 58%),
    radial-gradient(900px 820px at 6% 88%, #5e2408 0%, transparent 60%),
    linear-gradient(180deg,#2b0f05 0%,#481a07 28%,#61270b 50%,#3c1506 76%,#1d0803 100%);
}
.bg::after{content:"";position:absolute;inset:-25%;
  background:
    radial-gradient(600px 420px at 22% 28%, rgba(255,152,62,.17), transparent 70%),
    radial-gradient(720px 520px at 78% 68%, rgba(255,96,40,.15), transparent 70%),
    radial-gradient(500px 400px at 55% 95%, rgba(255,190,90,.12), transparent 70%);
  filter:blur(50px);
  animation:drift 26s ease-in-out infinite alternate;
}
@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(3%,-2%) scale(1.08)}
}
.vignette{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, transparent 42%, rgba(20,5,0,.55) 100%);}
#embers{position:fixed;inset:0;z-index:-1;pointer-events:none}
#confetti{position:fixed;inset:0;z-index:80;pointer-events:none}

/* ============ 灯笼 ============ */
.lantern{position:fixed;top:0;z-index:5;transform-origin:top center;cursor:pointer;
  animation:sway 5.5s ease-in-out infinite;transition:filter .3s}
.lantern:hover{filter:brightness(1.25)}
.lantern.l{left:4vw}
.lantern.r{right:4vw;animation-delay:-2.4s;animation-duration:6.4s}
.lantern .cord{display:block;width:2px;height:clamp(38px,7vh,80px);margin:0 auto;
  background:linear-gradient(#ffd79a,#a8641f);opacity:.75}
.lantern .lamp{width:clamp(46px,6.5vw,74px);aspect-ratio:.8;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;
  background:radial-gradient(circle at 34% 28%, #ffe3a4, #ff9134 52%, #cf4e0a 100%);
  box-shadow:0 0 34px rgba(255,150,55,.75), 0 0 90px rgba(255,110,30,.35),
             inset -6px -8px 22px rgba(140,45,0,.5);
  position:relative;
}
.lantern .lamp::before{content:"";position:absolute;inset:6% 8%;border-radius:inherit;
  background:repeating-linear-gradient(90deg, transparent 0 12%, rgba(150,50,0,.22) 12% 15%, transparent 15% 27%);
  pointer-events:none}
.lantern .lamp::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  width:3px;height:22px;border-radius:2px;
  background:linear-gradient(#ffd070,#c9761a);
  box-shadow:0 22px 0 -1px #ffcf7a, 0 26px 8px rgba(255,160,60,.4)}
.lantern .cap{position:absolute;left:50%;transform:translateX(-50%);
  width:34%;height:7px;border-radius:3px;background:#a8641f;top:-4px}
@keyframes sway{0%,100%{transform:rotate(-3.2deg)}50%{transform:rotate(3.2deg)}}

/* ============ 顶部进度 ============ */
.steps{position:fixed;top:clamp(18px,3.2vh,32px);left:50%;transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:clamp(8px,1.6vw,16px)}
.steps .bar{position:relative;height:4px;width:clamp(34px,7vw,74px);border-radius:3px;cursor:default;
  background:rgba(255,205,140,.16);overflow:hidden;transition:background .4s}
.steps .bar i{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);
  background:linear-gradient(90deg,#ffb054,#ffe0a8);border-radius:3px;
  transition:transform .7s cubic-bezier(.22,.61,.36,1)}
.steps .bar.done i{transform:scaleX(1)}
.steps .bar.done{cursor:pointer}
.steps .bar.done:hover{background:rgba(255,205,140,.34)}
.steps .bar.now{background:rgba(255,205,140,.3);box-shadow:0 0 16px rgba(255,180,90,.55)}
.steps .bar.now i{transform:scaleX(1);transition:transform 1.1s cubic-bezier(.22,.61,.36,1)}

/* ============ 舞台 / 每一幕 ============ */
#stage{position:fixed;inset:0;z-index:2}
.scene{position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(70px,11vh,120px) clamp(20px,6vw,80px) clamp(40px,8vh,80px);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(46px) scale(.965);
  transition:opacity .75s ease, transform .85s cubic-bezier(.22,.61,.36,1), visibility .85s;
  overflow-y:auto;overflow-x:hidden}
.scene.active{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.scene.leaving{transform:translateY(-46px) scale(.965)}
.scene::-webkit-scrollbar{width:0}

/* 幕内显现 */
.rv{opacity:0;transform:translateY(30px);
  transition:opacity .9s cubic-bezier(.22,.61,.36,1), transform .9s cubic-bezier(.22,.61,.36,1);
  transition-delay:var(--d,0s)}
.scene.active .rv{opacity:1;transform:none}
.rv.scale{transform:translateY(22px) scale(.95)}
.scene.active .rv.scale{transform:none}

/* ============ 继续按钮 ============ */
.next{position:relative;margin-top:clamp(30px,5.5vh,56px);padding:15px 46px;border-radius:999px;cursor:pointer;
  font-family:var(--sans);font-size:clamp(14px,1.9vw,17px);letter-spacing:.26em;text-indent:.26em;
  color:#4a1a03;border:none;background:linear-gradient(180deg,#ffe6b0,#ffa63f);
  box-shadow:0 0 30px rgba(255,165,65,.65), 0 0 80px rgba(255,130,40,.3), inset 0 -4px 14px rgba(160,70,0,.35);
  opacity:0;transform:translateY(18px);pointer-events:none;
  transition:opacity .7s ease, transform .7s cubic-bezier(.34,1.56,.64,1), box-shadow .28s}
.next.ready{opacity:1;transform:none;pointer-events:auto;
  animation:breatheBtn 3s ease-in-out infinite}
.next.ready:hover{transform:translateY(-4px) scale(1.05);
  box-shadow:0 0 46px rgba(255,190,90,1), 0 0 120px rgba(255,140,50,.5), inset 0 -4px 14px rgba(160,70,0,.35)}
.next.ready:active{transform:translateY(0) scale(.98)}
@keyframes breatheBtn{
  0%,100%{box-shadow:0 0 30px rgba(255,165,65,.65),0 0 80px rgba(255,130,40,.3),inset 0 -4px 14px rgba(160,70,0,.35)}
  50%{box-shadow:0 0 46px rgba(255,195,95,.95),0 0 120px rgba(255,145,50,.48),inset 0 -4px 14px rgba(160,70,0,.35)}
}
.next-hint{margin-top:26px;font-size:clamp(12px,1.6vw,14px);letter-spacing:.22em;
  color:rgba(233,201,164,.62);text-indent:.22em;text-align:center;
  opacity:0;transition:opacity .6s ease .3s}
.next-hint.show{opacity:1}
.skip{margin-top:16px;background:none;border:none;cursor:pointer;
  font-family:var(--sans);font-size:13px;letter-spacing:.18em;
  color:rgba(233,201,164,.5);text-decoration:underline;text-underline-offset:5px;
  transition:color .3s;padding:8px}
.skip:hover{color:var(--gold-2)}

/* ============ 第一幕 ============ */
.moon{position:relative;width:clamp(150px,26vw,244px);aspect-ratio:1;
  animation:floaty 9s ease-in-out infinite}
.moon .halo{position:absolute;inset:-75%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(255,206,124,.34) 0%, rgba(255,158,60,.13) 36%, transparent 68%);
  animation:breathe 7s ease-in-out infinite}
.moon .body{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 35% 30%, #fffaea 0%, #ffe6ac 42%, #f7cd80 70%, #dfa74c 100%);
  box-shadow:0 0 70px rgba(255,198,110,.55), 0 0 170px rgba(255,148,58,.32),
             inset -16px -14px 44px rgba(176,106,26,.38);
  animation:breathe 7s ease-in-out infinite}
.moon .body::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 66% 26%, rgba(184,126,44,.30) 0 9%, transparent 10%),
    radial-gradient(circle at 30% 62%, rgba(184,126,44,.26) 0 12%, transparent 13%),
    radial-gradient(circle at 72% 68%, rgba(184,126,44,.22) 0 7%, transparent 8%),
    radial-gradient(circle at 46% 40%, rgba(184,126,44,.16) 0 5%, transparent 6%)}
.moon .rabbit{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:46%;opacity:.42;filter:blur(.4px)}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.035);opacity:.93}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

#s1 .col{display:flex;flex-direction:column;align-items:center;gap:clamp(22px,4.5vh,44px);margin-top:clamp(24px,5vh,52px)}
.hero-title{font-family:var(--serif);font-weight:400;
  font-size:clamp(50px,12vw,124px);letter-spacing:.12em;line-height:1.15;
  color:#fff6e4;text-align:center;
  text-shadow:0 0 26px rgba(255,196,107,.75), 0 0 70px rgba(255,130,40,.5), 0 6px 30px rgba(0,0,0,.45);
  animation:glowPulse 5s ease-in-out infinite}
@keyframes glowPulse{
  0%,100%{text-shadow:0 0 26px rgba(255,196,107,.75),0 0 70px rgba(255,130,40,.5),0 6px 30px rgba(0,0,0,.45)}
  50%{text-shadow:0 0 40px rgba(255,214,140,.95),0 0 110px rgba(255,150,60,.65),0 6px 30px rgba(0,0,0,.45)}
}
.hero-sub{text-align:center;font-size:clamp(13px,1.6vw,16px);
  letter-spacing:.5em;color:var(--cream-dim);text-indent:.5em}
.hero-date{margin-top:12px;text-align:center;font-size:clamp(12px,1.4vw,14px);
  letter-spacing:.32em;color:rgba(233,201,164,.55);text-indent:.32em}

/* ============ 第二幕 ============ */
.bless{display:flex;flex-direction:column;gap:clamp(26px,5vh,52px);text-align:center;
  width:min(920px,100%)}
.bless p{font-family:var(--serif);
  font-size:clamp(26px,5.2vw,56px);line-height:1.55;letter-spacing:.06em;
  color:#fff4e0;
  text-shadow:0 0 22px rgba(255,180,90,.45), 0 4px 24px rgba(0,0,0,.4)}
.bless p .hl{color:var(--gold-2);text-shadow:0 0 30px rgba(255,200,110,.85),0 0 70px rgba(255,150,60,.5)}
.bless .dim{color:var(--cream-dim);font-size:.78em;text-shadow:0 0 16px rgba(255,170,80,.3)}
.bless-rule{width:0;height:1px;margin:0 auto;
  background:linear-gradient(90deg,transparent,rgba(255,196,107,.85),transparent);
  transition:width 1.5s cubic-bezier(.22,.61,.36,1)}
.scene.active .bless-rule{width:min(420px,70%)}

/* ============ 第三幕 视频 ============ */
.video-card{position:relative;width:min(880px,100%);border-radius:22px;overflow:hidden;
  background:#160703;
  box-shadow:0 0 0 1px rgba(255,190,110,.25), 0 0 60px rgba(255,130,40,.32), 0 30px 80px rgba(0,0,0,.6);
  transition:transform .6s cubic-bezier(.22,.61,.36,1), box-shadow .6s}
.video-card:hover{transform:translateY(-6px);
  box-shadow:0 0 0 1px rgba(255,200,130,.45), 0 0 90px rgba(255,140,50,.45), 0 34px 90px rgba(0,0,0,.65)}
.video-card video{display:block;width:100%;max-height:62vh;background:#000;object-fit:contain}
.play-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;cursor:pointer;z-index:3;
  background:radial-gradient(ellipse at center, rgba(60,20,4,.35), rgba(20,6,2,.82));
  backdrop-filter:blur(3px);transition:opacity .5s, visibility .5s}
.play-ov.hide{opacity:0;visibility:hidden}
.play-btn{width:clamp(70px,11vw,96px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%, #ffe3a6, #ff9134 60%, #d4560c 100%);
  box-shadow:0 0 40px rgba(255,150,55,.8), 0 0 100px rgba(255,110,30,.4), inset 0 -6px 18px rgba(150,50,0,.45);
  animation:pulseBtn 2.4s ease-in-out infinite;transition:transform .3s}
.play-ov:hover .play-btn{transform:scale(1.09)}
.play-btn svg{width:34%;margin-left:8%;fill:#4a1a03}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 40px rgba(255,150,55,.8),0 0 100px rgba(255,110,30,.4),inset 0 -6px 18px rgba(150,50,0,.45)}
  50%{box-shadow:0 0 60px rgba(255,180,80,1),0 0 140px rgba(255,130,40,.55),inset 0 -6px 18px rgba(150,50,0,.45)}}
.play-ov p{font-size:clamp(14px,1.9vw,18px);letter-spacing:.18em;color:#ffe9cd;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.v-title{text-align:center;font-family:var(--serif);font-size:clamp(20px,3.6vw,34px);
  letter-spacing:.14em;color:#fff2dc;text-shadow:0 0 22px rgba(255,180,90,.5);text-indent:.14em;
  margin-bottom:clamp(22px,4vh,38px)}

/* ============ 第四幕 月饼 ============ */
.plate{position:relative;width:min(760px,100%);
  padding:clamp(24px,4.5vw,52px) clamp(18px,4vw,48px) clamp(34px,5vw,58px);
  border-radius:50% 50% 46% 46%/14% 14% 20% 20%;
  background:
    radial-gradient(ellipse at 50% 18%, rgba(255,228,180,.16), transparent 62%),
    linear-gradient(180deg,#96551f 0%,#7b4114 55%,#5b2d0c 100%);
  box-shadow:0 0 0 1px rgba(255,206,140,.3), inset 0 3px 30px rgba(255,214,150,.26),
             inset 0 -16px 40px rgba(60,22,0,.4), 0 26px 70px rgba(0,0,0,.5)}
.mc-row{display:flex;justify-content:center;gap:clamp(10px,2.2vw,30px)}
.mc{position:relative;flex:0 1 clamp(62px,13vw,124px);aspect-ratio:1;cursor:pointer;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1), filter .45s, opacity .5s;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.mc svg{display:block;width:100%;height:100%;overflow:visible}
.mc:hover{transform:translateY(-12px) rotate(-3deg) scale(1.07);
  filter:drop-shadow(0 0 24px rgba(255,190,100,.85)) drop-shadow(0 14px 22px rgba(0,0,0,.5))}
.mc .bites{transform-origin:50% 50%;transition:transform .22s cubic-bezier(.36,.07,.19,.97)}
.mc .tag{position:absolute;left:50%;bottom:-30px;transform:translate(-50%,6px);
  font-size:12px;letter-spacing:.14em;color:#ffd9a0;white-space:nowrap;
  opacity:0;transition:opacity .3s, transform .3s;pointer-events:none;
  text-shadow:0 0 12px rgba(255,150,60,.9)}
.mc:hover .tag{opacity:1;transform:translate(-50%,0)}
.mc.eating{pointer-events:none}
.mc.gone{opacity:0;transform:scale(.35) rotate(22deg);pointer-events:none}
.mc.dim{opacity:.22;filter:grayscale(.7) blur(1px) drop-shadow(0 6px 12px rgba(0,0,0,.4));pointer-events:none}
.plate-hint{text-align:center;margin-top:clamp(34px,5.5vw,56px);font-size:clamp(13px,1.7vw,16px);
  letter-spacing:.22em;color:var(--cream-dim);text-indent:.22em;min-height:1.4em;transition:opacity .5s}
.mc-title{text-align:center;font-family:var(--serif);font-size:clamp(21px,4vw,38px);
  letter-spacing:.14em;color:#fff2dc;text-shadow:0 0 24px rgba(255,180,90,.55);text-indent:.14em;
  margin-bottom:clamp(26px,4.5vh,46px)}
.crumb{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:70;
  background:radial-gradient(circle at 35% 30%, #ffd794, #b9702a);
  box-shadow:0 0 8px rgba(255,180,90,.7)}

/* 称号卡 */
.result{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:24px;
  background:radial-gradient(ellipse at center, rgba(70,24,4,.72), rgba(14,4,1,.93));
  backdrop-filter:blur(7px)}
.result.show{display:grid;animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{position:relative;width:min(460px,100%);padding:clamp(32px,5.5vw,50px) clamp(26px,5vw,44px);
  border-radius:26px;text-align:center;
  background:linear-gradient(165deg,#7a3a12 0%,#5a2709 42%,#2e1003 100%);
  box-shadow:0 0 0 1px rgba(255,206,130,.42), 0 0 70px rgba(255,150,60,.5),
             0 30px 90px rgba(0,0,0,.7), inset 0 2px 24px rgba(255,205,130,.18);
  animation:cardIn .75s cubic-bezier(.34,1.5,.5,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.86) rotateX(14deg)}to{opacity:1;transform:none}}
.card .kicker{font-size:12px;letter-spacing:.42em;color:rgba(255,214,150,.75);text-indent:.42em}
.card .who{margin:20px 0 14px;font-family:var(--serif);font-weight:400;
  font-size:clamp(38px,9vw,64px);letter-spacing:.08em;color:#fff6e2;
  text-shadow:0 0 28px rgba(255,200,110,.9), 0 0 72px rgba(255,140,50,.6);
  animation:whoIn .9s cubic-bezier(.34,1.56,.64,1) .18s both}
@keyframes whoIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.card .desc{font-size:clamp(13px,1.9vw,16px);letter-spacing:.16em;color:var(--cream-dim);line-height:1.9}
.card .card-rule{width:60px;height:1px;margin:22px auto;
  background:linear-gradient(90deg,transparent,rgba(255,196,107,.9),transparent)}
.card-btns{display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.card button{padding:12px 28px;border-radius:999px;cursor:pointer;
  font-family:var(--sans);font-size:14px;letter-spacing:.18em;text-indent:.18em;border:none;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s}
.card .again{color:#ffdfae;background:rgba(255,200,130,.13);
  box-shadow:inset 0 0 0 1px rgba(255,200,130,.42)}
.card .again:hover{transform:translateY(-3px);background:rgba(255,200,130,.24);
  box-shadow:inset 0 0 0 1px rgba(255,210,150,.75), 0 0 24px rgba(255,170,80,.45)}
.card .go{color:#4a1a03;background:linear-gradient(180deg,#ffe0a4,#ffab4e);
  box-shadow:0 0 26px rgba(255,160,60,.6), inset 0 -3px 10px rgba(160,70,0,.35)}
.card .go:hover{transform:translateY(-3px) scale(1.04);
  box-shadow:0 0 40px rgba(255,180,80,.9), inset 0 -3px 10px rgba(160,70,0,.35)}
.card .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd88f;
  box-shadow:0 0 12px 3px rgba(255,190,100,.9);pointer-events:none}

/* ============ 第五幕 ============ */
#s5 .big{font-family:var(--serif);font-weight:400;text-align:center;
  font-size:clamp(34px,8.4vw,92px);line-height:1.5;letter-spacing:.1em;color:#fff6e4;
  text-shadow:0 0 30px rgba(255,200,115,.8), 0 0 90px rgba(255,140,50,.55), 0 8px 34px rgba(0,0,0,.5)}
#s5 .big .hl{color:#ffdfa0}
#s5 .sub{margin-top:24px;text-align:center;font-family:var(--serif);
  font-size:clamp(15px,2.6vw,24px);letter-spacing:.42em;color:var(--cream-dim);text-indent:.42em}
.bloom-btn{margin-top:clamp(36px,6vh,58px);padding:16px 46px;border-radius:999px;cursor:pointer;
  font-family:var(--sans);font-size:clamp(14px,1.9vw,17px);letter-spacing:.26em;text-indent:.26em;
  color:#4a1a03;border:none;background:linear-gradient(180deg,#ffe6b0,#ffa63f);
  box-shadow:0 0 34px rgba(255,165,65,.7), 0 0 90px rgba(255,130,40,.35), inset 0 -4px 14px rgba(160,70,0,.35);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .28s}
.bloom-btn:hover{transform:translateY(-4px) scale(1.05);
  box-shadow:0 0 50px rgba(255,190,90,1), 0 0 130px rgba(255,140,50,.5), inset 0 -4px 14px rgba(160,70,0,.35)}
.bloom-btn:active{transform:translateY(0) scale(.98)}
.sign{margin-top:clamp(40px,7vh,72px);text-align:center;
  font-size:clamp(12px,1.6vw,14px);letter-spacing:.34em;color:rgba(233,201,164,.5);
  text-indent:.34em;line-height:2.2}
.restart{margin-top:22px;background:none;border:none;cursor:pointer;padding:10px;
  font-family:var(--sans);font-size:13px;letter-spacing:.2em;
  color:rgba(233,201,164,.45);text-decoration:underline;text-underline-offset:5px;
  transition:color .3s}
.restart:hover{color:var(--gold-2)}

/* ============ 音效 ============ */
.sound{position:fixed;right:20px;bottom:20px;z-index:60;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;border:1px solid rgba(255,200,130,.3);
  background:rgba(50,20,5,.62);backdrop-filter:blur(8px);color:#ffd9a0;font-size:17px;
  transition:transform .25s, background .25s, border-color .25s}
.sound:hover{transform:scale(1.1);background:rgba(80,34,8,.8);border-color:rgba(255,200,130,.6)}
.sound.off{color:rgba(255,200,140,.4)}

@media(max-width:820px){

<body>

<div class="lantern l" title="点一下试试"><span class="cord"></span><div class="lamp"><span class="cap"></span></div></div>

<div class="steps" id="steps">

<script>
(function(){
"use strict";

var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= 音效 (WebAudio 合成，无外部文件) ================= */
var Sound = (function(){
  var ctx = null, on = true;
  function ac(){
    if(!ctx){
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      ctx = new C();
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function noise(dur, f0, f1, vol, delay){
    if(!on) return; var c = ac(); if(!c) return;
    var n = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = "lowpass";
    var t0 = c.currentTime + (delay||0);
    f.frequency.setValueAtTime(f0, t0);
    f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur*0.16);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur + 0.05);
  }
  function tone(freq, at, dur, vol, type){
    if(!on) return; var c = ac(); if(!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    var t0 = c.currentTime + at;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  return {
    unlock:ac,
    chomp:function(){ noise(0.13, 1700, 420, 0.32, 0); },
    swipe:function(){ noise(0.42, 2400, 260, 0.13, 0); tone(392, 0.02, 0.5, 0.07, "sine"); },
    pop:function(){ tone(520, 0, 0.16, 0.13, "triangle"); tone(880, 0.05, 0.24, 0.09, "triangle"); },
    chime:function(){ tone(784,0,0.9,0.20); tone(1175,0.09,1.1,0.16); tone(1568,0.19,1.4,0.12); },
    bloom:function(){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f, i*0.075, 1.5, 0.13); }); },
    isOn:function(){ return on; },
    toggle:function(){ on = !on; if(on) ac(); return on; }
  };
})();

var soundBtn = document.getElementById("sound");
soundBtn.addEventListener("click", function(){
  var on = Sound.toggle();
  soundBtn.textContent = on ? "🔊" : "🔇";
  soundBtn.classList.toggle("off", !on);
  if(on) Sound.pop();
});
document.addEventListener("pointerdown", function once(){
  Sound.unlock(); document.removeEventListener("pointerdown", once);
}, {passive:true});

/* ================= 烛火粒子 ================= */
(function(){
  var cv = document.getElementById("embers"), c = cv.getContext("2d");
  var W=0, H=0, dpr=1, ps=[], raf=null;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width  = Math.floor(innerWidth  * dpr);
    H = cv.height = Math.floor(innerHeight * dpr);
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  }
  function spawn(init){
    return {
      x: Math.random()*W,
      y: init ? Math.random()*H : H + Math.random()*60*dpr,
      r: (Math.random()*2.1 + 0.7) * dpr,
      vy: -(Math.random()*0.34 + 0.10) * dpr,
      vx: (Math.random()-0.5) * 0.28 * dpr,
      a: Math.random()*0.5 + 0.22,
      ph: Math.random()*Math.PI*2,
      sp: Math.random()*0.022 + 0.006,
      hue: 26 + Math.random()*22
    };
  }
  function loop(){
    c.clearRect(0,0,W,H);
    for(var i=0;i<ps.length;i++){
      var p = ps[i];
      p.y += p.vy; p.x += p.vx + Math.sin(p.ph)*0.22*dpr; p.ph += p.sp;
      if(p.y < -40*dpr){ ps[i] = spawn(false); continue; }
      var flick = 0.62 + Math.sin(p.ph*3.1)*0.38;
      var g = c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*7);
      g.addColorStop(0, "hsla(" + p.hue + ",100%,72%," + (p.a*flick) + ")");
      g.addColorStop(0.35, "hsla(" + (p.hue-6) + ",100%,58%," + (p.a*flick*0.34) + ")");
      g.addColorStop(1, "hsla(" + (p.hue-10) + ",100%,50%,0)");
      c.fillStyle = g;
      c.beginPath(); c.arc(p.x,p.y,p.r*7,0,6.2832); c.fill();
    }
    raf = requestAnimationFrame(loop);
  }
  resize();
  var n = reduced ? 18 : Math.round(Math.min(innerWidth, 1600) / 13);
  for(var i=0;i<n;i++) ps.push(spawn(true));
  addEventListener("resize", resize);
  loop();
})();

/* ================= 撒花 ================= */
var Confetti = (function(){
  var cv = document.getElementById("confetti"), c = cv.getContext("2d");
  var W=0, H=0, dpr=1, ps=[], raf=null, running=false, endAt=0;
  var COLORS = ["#ffd166","#ff9f43","#ff6b6b","#ffb3c6","#ffe6a7","#f9c74f","#ff8a5c","#fff0c9","#e8a0bf"];
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width  = Math.floor(innerWidth*dpr);
    H = cv.height = Math.floor(innerHeight*dpr);
    cv.style.width = innerWidth+"px"; cv.style.height = innerHeight+"px";
  }
  function mk(){
    return {
      x: Math.random()*W,
      y: -30*dpr - Math.random()*H*0.4,
      w: (6 + Math.random()*11)*dpr,
      h: (5 + Math.random()*9)*dpr,
      vy: (1.4 + Math.random()*2.6)*dpr,
      vx: (Math.random()-0.5)*1.5*dpr,
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.16,
      col: COLORS[(Math.random()*COLORS.length)|0],
      ph: Math.random()*Math.PI*2,
      petal: Math.random() < 0.45
    };
  }
  function burst(n){
    if(reduced) return;
    if(!W) resize();
    for(var i=0;i<n;i++) ps.push(mk());
    endAt = performance.now() + 9000;
    if(!running){ running = true; if(!raf) raf = requestAnimationFrame(loop); }
  }
  function loop(){
    c.clearRect(0,0,W,H);
    for(var i=ps.length-1;i>=0;i--){
      var p = ps[i];
      p.ph += 0.045;
      p.y  += p.vy;
      p.x  += p.vx + Math.sin(p.ph)*1.1*dpr;
      p.rot += p.vr;
      if(p.y > H + 60*dpr){ ps.splice(i,1); continue; }
      c.save();
      c.translate(p.x, p.y); c.rotate(p.rot);
      c.globalAlpha = 0.92; c.fillStyle = p.col;
      if(p.petal){
        c.beginPath(); c.ellipse(0,0,p.w*0.5,p.h*0.5,0,0,6.2832); c.fill();
      }else{
        c.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      }
      c.restore();
    }
    if(ps.length === 0 && performance.now() > endAt){
      running = false; raf = null; c.clearRect(0,0,W,H); return;
    }
    raf = requestAnimationFrame(loop);
  }
  addEventListener("resize", resize);
  resize();
  return { burst:burst };
})();

/* ================= 幕间推进 ================= */
var ORDER = ["s1","s2","s3","s4","s5"];
var scenes = ORDER.map(function(id){ return document.getElementById(id); });
var bars   = Array.prototype.slice.call(document.querySelectorAll("#steps .bar"));
var cur = -1, maxStep = -1, entered = {};

function sceneOf(id){ return document.getElementById(id); }
function nextBtn(sc){ return sc.querySelector("[data-next]"); }
function unlock(sc){ var b = nextBtn(sc); if(b) b.classList.add("ready"); }

function paintSteps(){
  bars.forEach(function(b, i){
    b.classList.toggle("done", i < cur);
    b.classList.toggle("now",  i === cur);
  });
}

function goTo(i){
  if(i < 0 || i >= ORDER.length || i === cur) return;

  if(cur >= 0){
    var prev = scenes[cur];
    prev.classList.remove("active");
    prev.classList.add("leaving");
    setTimeout(function(){ prev.classList.remove("leaving"); }, 900);
    if(prev.id === "s3" && !MV.paused) MV.pause();
  }

  cur = i;
  if(i > maxStep) maxStep = i;
  var sc = scenes[i];
  sc.classList.add("active");
  sc.scrollTop = 0;

  paintSteps();
  Sound.swipe();
  enter(sc);
}

/* 每一幕进入时的逻辑 */
function enter(sc){
  if(sc.id === "s1"){
    if(!entered.s1){ entered.s1 = 1; setTimeout(function(){ unlock(sc); }, reduced ? 200 : 1500); }
    else unlock(sc);
  }
  else if(sc.id === "s2"){
    if(!entered.s2){ entered.s2 = 1; setTimeout(function(){ unlock(sc); }, reduced ? 300 : 3900); }
    else unlock(sc);
  }
  else if(sc.id === "s3"){
    tryPlay();
  }
  else if(sc.id === "s5"){
    Sound.bloom();
    Confetti.burst(reduced ? 60 : 220);
    setTimeout(function(){ Confetti.burst(reduced ? 40 : 140); }, 600);
  }
}

/* 点「继续」 */
document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("[data-next]") : null;
  if(!b || !b.classList.contains("ready")) return;
  Sound.pop();
  goTo(cur + 1);
});

/* 进度条：已完成的可以点回去 */
bars.forEach(function(b, i){
  b.addEventListener("click", function(){
    if(i <= maxStep && i !== cur){ Sound.pop(); goTo(i); }
  });
});

/* 键盘：空格 / 回车 / → 继续 */
addEventListener("keydown", function(e){
  if(resultEl.classList.contains("show")) return;
  if(e.key === " " || e.key === "Enter" || e.key === "ArrowRight"){
    var b = nextBtn(scenes[cur]);
    if(b && b.classList.contains("ready")){ e.preventDefault(); Sound.pop(); goTo(cur + 1); }
  }
  if(e.key === "ArrowLeft" && cur > 0){ e.preventDefault(); Sound.pop(); goTo(cur - 1); }
});

/* ================= 视频 ================= */
var MV = document.getElementById("mv"), playOv = document.getElementById("playOv");
var vHint = document.getElementById("vHint"), vSkip = document.getElementById("vSkip");
var videoUnlocked = false;

function tryPlay(){
  playOv.classList.remove("hide");
  var p = MV.play();
  if(p && p.catch){ p.catch(function(){ playOv.classList.remove("hide"); }); }
}
function videoDone(){
  if(videoUnlocked) return;
  videoUnlocked = true;
  unlock(sceneOf("s3"));
  vHint.classList.remove("show");
  vSkip.style.display = "none";
}
playOv.addEventListener("click", function(){
  Sound.unlock();
  playOv.classList.add("hide");
  var p = MV.play();
  if(p && p.catch) p.catch(function(){ playOv.classList.remove("hide"); });
});
MV.addEventListener("play",  function(){ playOv.classList.add("hide"); });
MV.addEventListener("pause", function(){ if(!MV.ended) playOv.classList.remove("hide"); });
MV.addEventListener("ended", function(){ playOv.classList.remove("hide"); videoDone(); });
vSkip.addEventListener("click", function(){ Sound.pop(); videoDone(); vHint.classList.remove("show"); });

/* ================= 月饼 ================= */
var TITLES = [
  { name:"gay",     desc:"兄弟情深，懂得都懂 🌈" },
  { name:"小男梁",   desc:"名字最秀，人最靠谱" },
  { name:"大帅哥",   desc:"颜值担当，实至名归" },
  { name:"奶蛙本蛙", desc:"就是本蛙，无可替代 🐸" },
  { name:"神人",     desc:"超脱凡尘，队内传说" }
];

function mooncakeSVG(i){
  var uid = "mc" + i + "_" + Math.floor(Math.random()*1e6);
  var hue = 30 + i*4;
  return '<svg viewBox="0 0 100 100">'
  +  '<defs>'
  +   '<radialGradient id="' + uid + '" cx="34%" cy="28%" r="78%">'
  +     '<stop offset="0%"  stop-color="hsl(' + (hue+18) + ',88%,86%)"/>'
  +     '<stop offset="45%" stop-color="hsl(' + (hue+6) + ',80%,68%)"/>'
  +     '<stop offset="100%" stop-color="hsl(' + (hue-6) + ',74%,47%)"/>'
  +   '</radialGradient>'
  +   '<linearGradient id="' + uid + 's" x1="0" y1="0" x2="0" y2="1">'
  +     '<stop offset="0%" stop-color="rgba(255,240,205,.55)"/>'
  +     '<stop offset="100%" stop-color="rgba(120,60,10,.35)"/>'
  +   '</linearGradient>'
  +  '</defs>'
  +  '<g class="bites">'
  +   '<rect x="7" y="7" width="86" height="86" rx="27" fill="url(#' + uid + ')"/>'
  +   '<rect x="7" y="7" width="86" height="86" rx="27" fill="url(#' + uid + 's)" opacity=".45"/>'
  +   '<rect x="7" y="7" width="86" height="86" rx="27" fill="none" stroke="rgba(126,66,14,.65)" stroke-width="2"/>'
  +   '<g fill="none" stroke="rgba(122,62,12,.55)" stroke-width="2.1" stroke-linecap="round">'
  +     '<circle cx="50" cy="50" r="21"/><circle cx="50" cy="50" r="13"/>'
  +     '<path d="M50 20 V35 M50 65 V80 M20 50 H35 M65 50 H80"/>'
  +     '<path d="M29 29 L39 39 M71 29 L61 39 M29 71 L39 61 M71 71 L61 61"/>'
  +   '</g>'
  +   '<circle cx="50" cy="50" r="6.5" fill="rgba(122,62,12,.5)"/>'
  +   '<ellipse cx="34" cy="27" rx="13" ry="8" fill="rgba(255,246,220,.30)" transform="rotate(-28 34 27)"/>'
  +  '</g></svg>';
}

var mcRow = document.getElementById("mcRow");
var plateHint = document.getElementById("plateHint");
var resultEl = document.getElementById("result");
var whoEl = document.getElementById("who");
var descEl = document.getElementById("desc");
var cardEl = document.getElementById("card");
var locked = false;

for(var i=0;i<5;i++){
  (function(idx){
    var d = document.createElement("div");
    d.className = "mc";
    d.innerHTML = mooncakeSVG(idx) + '<span class="tag">咬 我</span>';
    d.addEventListener("click", function(){ eat(d); });
    mcRow.appendChild(d);
  })(i);
}

function crumbs(el, count){
  var r = el.getBoundingClientRect();
  var cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(var k=0;k<count;k++){
    var c = document.createElement("span");
    c.className = "crumb";
    var sz = 4 + Math.random()*7;
    c.style.width = sz + "px"; c.style.height = sz + "px";
    c.style.left = (cx - sz/2) + "px";
    c.style.top  = (cy - sz/2) + "px";
    document.body.appendChild(c);
    var ang = Math.random()*Math.PI*2, dist = 50 + Math.random()*130;
    var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 40;
    var rot = (Math.random()*720 - 360);
    c.animate([
      { transform:"translate(0,0) rotate(0deg) scale(1)", opacity:1 },
      { transform:"translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg) scale(.3)", opacity:0 }
    ], { duration: 620 + Math.random()*420, easing:"cubic-bezier(.2,.7,.3,1)" })
     .onfinish = function(){ c.remove(); };
  }
}

function eat(el){
  if(locked) return;
  locked = true;
  el.classList.add("eating");
  plateHint.textContent = "咔嚓——";

  var bites = el.querySelector(".bites");
  var scales = [.88, .72, .54, .34, .12, 0];
  var n = 0;
  var timer = setInterval(function(){
    if(n >= scales.length){
      clearInterval(timer);
      el.classList.add("gone");
      plateHint.textContent = "尝尝……这味道有点东西";
      setTimeout(reveal, 480);
      return;
    }
    bites.style.transform = "scale(" + scales[n] + ") rotate(" + (n*8 - 8) + "deg)";
    Sound.chomp();
    crumbs(el, n === scales.length-1 ? 22 : 9);
    n++;
  }, 200);
}

function reveal(){
  Array.prototype.forEach.call(mcRow.children, function(c){
    if(!c.classList.contains("gone")) c.classList.add("dim");
  });
  var pick = TITLES[Math.floor(Math.random()*TITLES.length)];
  whoEl.textContent  = pick.name;
  descEl.textContent = pick.desc;
  resultEl.classList.add("show");
  Sound.chime();
  setTimeout(sparkle, 260);
}

function sparkle(){
  var r = cardEl.getBoundingClientRect();
  for(var i=0;i<26;i++){
    var s = document.createElement("span");
    s.className = "spark";
    var sz = 3 + Math.random()*4;
    s.style.width = sz + "px"; s.style.height = sz + "px";
    s.style.left = (r.left + Math.random()*r.width) + "px";
    s.style.top  = (r.top  + Math.random()*r.height) + "px";
    document.body.appendChild(s);
    var ang = Math.random()*Math.PI*2, dist = 30 + Math.random()*90;
    s.animate([
      { transform:"translate(0,0) scale(0)", opacity:0 },
      { transform:"translate(" + (Math.cos(ang)*dist*.5) + "px," + (Math.sin(ang)*dist*.5) + "px) scale(1.4)", opacity:1, offset:.35 },
      { transform:"translate(" + (Math.cos(ang)*dist) + "px," + (Math.sin(ang)*dist) + "px) scale(0)", opacity:0 }
    ], { duration: 1000 + Math.random()*700, easing:"ease-out", delay: Math.random()*260 })
     .onfinish = function(){ s.remove(); };
  }
  Confetti.burst(120);
}

function resetPlate(){
  resultEl.classList.remove("show");
  Array.prototype.forEach.call(mcRow.children, function(c){
    c.classList.remove("gone","dim","eating");
    var b = c.querySelector(".bites");
    b.style.transition = "none";
    b.style.transform  = "scale(1) rotate(0deg)";
    void b.offsetWidth;
    b.style.transition = "";
  });
  plateHint.textContent = "盘子里有五块 —— 点一块，咬下去";
  locked = false;
}
document.getElementById("again").addEventListener("click", function(){ Sound.pop(); resetPlate(); });
document.getElementById("goNext").addEventListener("click", function(){
  Sound.pop();
  resultEl.classList.remove("show");
  unlock(sceneOf("s4"));          // 吃过一次就算完成这一步
  goTo(ORDER.indexOf("s4") + 1);
});
resultEl.addEventListener("click", function(e){ if(e.target === resultEl){ Sound.pop(); resetPlate(); } });

/* ================= 撒花 / 重来 ================= */
document.getElementById("bloom").addEventListener("click", function(){
  Sound.unlock(); Sound.bloom();
  Confetti.burst(reduced ? 40 : 190);
  setTimeout(function(){ Confetti.burst(reduced ? 30 : 130); }, 420);
  setTimeout(function(){ Confetti.burst(reduced ? 30 : 130); }, 900);
});

document.getElementById("restart").addEventListener("click", function(){
  Sound.pop();
  resetPlate();
  entered = {};
  maxStep = -1;
  videoUnlocked = false;
  vSkip.style.display = "";
  vHint.classList.remove("show");
  MV.pause(); MV.currentTime = 0;
  playOv.classList.remove("hide");
  scenes.forEach(function(sc){
    sc.classList.remove("active","leaving");
    var b = nextBtn(sc); if(b) b.classList.remove("ready");
  });
  cur = -1;
  goTo(0);
});

/* 视频完成后才提示、才解锁 */
MV.addEventListener("loadedmetadata", function(){
  if(!videoUnlocked) setTimeout(function(){ vHint.classList.add("show"); }, 600);
});

/* ================= 灯笼 ================= */
(function(){
  var hues = [[28,52,10],[8,46,6],[42,60,14],[18,50,8]], k = 0;
  Array.prototype.forEach.call(document.querySelectorAll(".lantern"), function(L){
    L.addEventListener("click", function(){
      k = (k+1) % hues.length;
      var h = hues[k], lamp = L.querySelector(".lamp");
      lamp.style.background = "radial-gradient(circle at 34% 28%, hsl(" + h[1] + ",95%,80%), hsl(" + h[0] + ",95%,58%) 52%, hsl(" + h[0] + ",92%,42%) 100%)";
      lamp.style.boxShadow  = "0 0 40px hsla(" + h[0] + ",95%,60%,.85), 0 0 100px hsla(" + h[0] + ",95%,50%,.45), inset -6px -8px 22px rgba(140,45,0,.5)";
      L.animate([
        { transform:"rotate(0deg) scale(1)" },
        { transform:"rotate(-9deg) scale(1.08)" },
        { transform:"rotate(9deg) scale(1.04)" },
        { transform:"rotate(0deg) scale(1)" }
      ], { duration: 900, easing:"ease-in-out" });
      Sound.pop();
    });
  });
})();

/* ================= 开场 ================= */
paintSteps();
goTo(0);

})();
</script>
